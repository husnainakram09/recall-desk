[client]
# Navigation is the sidebar selector in main.py; hide the auto-generated
# links Streamlit would otherwise build from app/pages/.
showSidebarNavigation = false

[theme]
# Restrained clinical palette: slate blue accent on cool neutrals.
# Match-state colours live in app/theme.py, not here.
base = "light"
primaryColor = "#2B5F75"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#EEF2F5"
textColor = "#1D2730"
font = "sans serif"
